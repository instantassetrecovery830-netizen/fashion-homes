
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFitStore | Luxury Fashion Ecosystem</title>
    <meta name="description" content="A high-fashion luxury marketplace connecting designers and buyers with AI-driven curation." />
    <meta property="og:title" content="MyFitStore" />
    <meta property="og:description" content="A high-fashion luxury marketplace connecting designers and buyers with AI-driven curation." />

    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyFitStore" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    >

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              luxury: {
                black: '#0a0a0a',
                charcoal: '#1A1A1A',
                gold: '#C5A059',
                'gold-hover': '#B08D48',
                cream: '#FDFCF8',
                'cream-dark': '#F5F2EA',
                taupe: '#8B8580',
                burgundy: '#4A0404',
                sage: '#9CAF88',
                clay: '#BA6B56',
                navy: '#1B2432',
                silver: '#E5E5E5'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.8s ease-out forwards',
              'slide-up': 'slideUp 0.8s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>

    <!-- Polyfill process.env for Gemini Service -->
    <script>
      window.process = {
        env: {
          API_KEY: '', // API Key will be injected by the environment or replaced manually
          NODE_ENV: 'development'
        }
      };
    </script>
<link rel="stylesheet" href="/index.css">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
